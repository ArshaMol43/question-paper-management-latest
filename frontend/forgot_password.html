<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="api-config.js"></script>
    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #4b3f72;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address
        </p>

        <form id="forgotPasswordForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Remember your password?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script>

        const API_URL = window.API_BASE_URL;

        document.getElementById("forgotPasswordForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const message =
                    document.getElementById("message");

                try {

                    const response = await fetch(
                        `${API_URL}/forgot-password`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );

                    const data = await response.json();

                    if (response.ok) {

                        message.style.color = "green";

                        message.textContent =
                            data.message;

                        if (data.reset_link) {
                            const resetLink = document.createElement("a");
                            resetLink.href = new URL(data.reset_link, `${API_URL}/`).href;
                            resetLink.textContent = "Reset Password";
                            message.append(document.createElement("br"), document.createElement("br"), resetLink);
                        }

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            data.detail || "Password reset failed.";

                    }

                } catch (error) {

                    console.error(error);

                    message.style.color = "red";

                    message.textContent =
                        "Cannot connect to server.";

                }

            }
        );

    </script>

</body>
</html>
