<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Question Paper Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d9;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Question Paper Management System
        </p>

        <form id="loginForm">

            <label for="userType">User Type</label>

            <select id="userType" required>
                <option value="">Select User Type</option>
                <option value="Student">Student</option>
                <option value="Faculty">Faculty</option>
                <option value="Admin">Admin</option>
            </select>

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="links">
            <p>
                <a href="forgot_password.html">Forgot Password?</a>
            </p>

            <p style="margin-top: 10px;">
                Don't have an account?
                <a href="create_account.html">Create Account</a>
            </p>
        </div>

    </div>


<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const userType =
            document.getElementById("userType").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (response.ok) {

                if (data.user_type !== userType) {

                    message.style.color = "red";

                    message.textContent =
                        "Wrong user type selected.";

                    return;
                }

                message.style.color = "green";

                message.textContent =
                    "Login successful!";

                setTimeout(() => {

                    if (data.user_type === "Student") {

                        window.location.href =
                            "student_dashboard.html";

                    }
                    else if (data.user_type === "Faculty") {

                        window.location.href =
                            "faculty_dashboard.html";

                    }
                    else if (data.user_type === "Admin") {

                        window.location.href =
                            "admin_dashboard.html";

                    }

                }, 1000);

            }
            else {

                message.style.color = "red";

                message.textContent =
                    data.detail || "Login failed.";

            }

        }
        catch (error) {

            message.style.color = "red";

            message.textContent =
                "Cannot connect to server.";

            console.error(error);
        }

    }
);

</script>

</body>
</html>
